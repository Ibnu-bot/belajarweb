<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemen form pada HTML</title>
</head>
<body>
  <form>
    <h1>Contoh element-element form pada HTML</h1>
    <label for="nama">Nama:
      <br>
      <input type="text" name="nama" id="nama" placeholder="Masukan Nama Anda">
    </label>
    <br>
    <label for="password">Password:
      <br>
      <input type="password" name="password" id="password" placeholder="Masukan Password Anda">
    </label>
    <br>
    <label for="email">Email:
      <br>
      <input type="email" name="email" id="email" placeholder="Masukan Email Anda">
    </label>
    <br>
    <label for="number">Nomor Handphone:
      <br>
      <input type="number" name="number" id="number" placeholder="Masukan Nomor Handphone Anda">
    </label>
    <br>
    <label for="date">Tanggal Lahir:
      <br>
      <input type="date" name="date" id="date">
    </label>
    <br>
    <label for="color">Pilih Warna:
      <br>
      <input type="color" name="color" id="color">
    </label>
    <br>
    <label for="file">Pilih File:
      <br>
      <input type="file" name="file" id="file">
    </label>
    <br>
    
    <button type="submit">Kirim</button>
  </form>
</body>
</html>
