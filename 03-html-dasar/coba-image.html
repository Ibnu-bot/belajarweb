<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Image</title>
</head>
<body>
  <!-- memunculkan gambar yang ada pada folder -->
  <img src="Ibnu.jpg" alt="Foto Ibnu" width="200">
  <!-- memunculkan gambar yang ada pada browser / internet -->
  <img src="https://i.pinimg.com/736x/d4/f2/11/d4f21135ef0e52046309c324c8986df8.jpg" alt="Foto Luffy" width="200">
  <!-- memunculkan gambar yang ada diluar folder -->
  <img src="../midea.png" alt="midea" width="200">
  <!-- memunculkan gambar yang ada pada folder image -->
  <img src="image/foto.jpg" alt="foto" width="200">
</body>
</html>
